apiVersion: apps/v1
kind: Deployment
metadata:
  name: tensorflow-qc
  namespace: amscp
  labels:
    app: tensorflow-qc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tensorflow-qc
  template:
    metadata:
      labels:
        app: tensorflow-qc
    spec:
      containers:
        - name: tensorflow-qc
          image: amscp-tensorflow-qc:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: MODEL_PATH
              value: /app/models/material_qc.keras
            - name: DATASET_DIR
              value: /app/sample_data
            - name: IMG_SIZE
              value: "128"
            - name: DEFECT_THRESHOLD
              value: "0.60"
          readinessProbe:
            httpGet:
              path: /health
              port: 8501
            initialDelaySeconds: 60
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8501
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: tf-models
              mountPath: /app/models
      volumes:
        - name: tf-models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tensorflow-qc
  namespace: amscp
spec:
  selector:
    app: tensorflow-qc
  ports:
    - name: http
      port: 8501
      targetPort: 8501

---
- name: Deploy AMSCP demo stack on EC2
  hosts: amscp
  become: true
  gather_facts: true

  vars:
    app_user: ubuntu
    app_group: ubuntu
    app_dir: /opt/amscp
    repo_url: "https://github.com/awonriaz/advanced-materials-platform.git"
    repo_branch: main
    compose_profile: full
    docker_apt_key_path: /etc/apt/keyrings/docker.asc

  tasks:
    - name: Install base packages required for Docker repository setup
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - python3
          - python3-pip
          - python3-venv
          - python-is-python3
          - python3-numpy
          - python3-pil
        update_cache: true
        state: present

    - name: Remove conflicting Ubuntu Docker packages if present
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - docker-compose-v2
          - podman-docker
        state: absent

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: "{{ docker_apt_key_path }}"
        mode: "0644"

    - name: Add Docker official apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by={{ docker_apt_key_path }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker Engine and Docker Compose plugin from Docker repo
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Add ubuntu user to Docker group
      ansible.builtin.user:
        name: "{{ app_user }}"
        groups: docker
        append: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0750"

    - name: Clone or update GitHub repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: true
        update: true
      become_user: "{{ app_user }}"

    - name: Create secure .env using project script
      ansible.builtin.command: bash scripts/init_env.sh
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

    - name: Generate current sample dataset
      ansible.builtin.command: python3 scripts/generate_samples.py
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"

    - name: Stop existing AMSCP Docker Compose stack if present
      ansible.builtin.command: docker compose --profile "{{ compose_profile }}" down --remove-orphans
      args:
        chdir: "{{ app_dir }}"
      failed_when: false
      changed_when: false

    - name: Remove leftover named AMSCP containers from previous failed runs
      ansible.builtin.shell: |
        docker rm -f amscp-api amscp-elasticsearch amscp-tensorflow-qc amscp-pytorch-qc amscp-prometheus amscp-mosquitto 2>/dev/null || true
      changed_when: false

    - name: Build and start Docker Compose full profile
      ansible.builtin.command: docker compose --profile "{{ compose_profile }}" up -d --build
      args:
        chdir: "{{ app_dir }}"

    - name: Show Docker Compose status
      ansible.builtin.command: docker compose --profile "{{ compose_profile }}" ps
      args:
        chdir: "{{ app_dir }}"
      register: compose_ps
      changed_when: false

    - name: Print Docker Compose status
      ansible.builtin.debug:
        var: compose_ps.stdout_lines

    - name: Wait for API health
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/health
        status_code: 200
      register: api_health
      retries: 30
      delay: 5
      until: api_health.status == 200

    - name: Wait for TensorFlow QC health
      ansible.builtin.uri:
        url: http://127.0.0.1:8501/health
        status_code: 200
      register: tf_health
      retries: 30
      delay: 5
      until: tf_health.status == 200

    - name: Wait for Elasticsearch health
      ansible.builtin.uri:
        url: http://127.0.0.1:9200
        status_code: 200
      register: es_health
      retries: 30
      delay: 5
      until: es_health.status == 200

    - name: Final deployment message
      ansible.builtin.debug:
        msg:
          - "AMSCP deployed successfully."
          - "External demo URL: http://{{ inventory_hostname }}:8000/health"
          - "SSH command: ssh -i ~/.ssh/amscp-key.pem ubuntu@{{ inventory_hostname }}"
          - "Run exam workflow on EC2:"
          - "cd {{ app_dir }} && bash scripts/run_level6_integrations_demo.sh"

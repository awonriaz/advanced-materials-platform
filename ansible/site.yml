---
- name: Deploy AMSCP demo stack on EC2
  hosts: amscp
  become: true
  vars:
    app_dir: /opt/amscp
  tasks:
    - name: Install packages
      apt:
        name:
          - git
          - docker.io
          - docker-compose-plugin
          - python3
          - python3-pip
        update_cache: true
        state: present

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0750"

    # Copy/clone your repository separately. Secrets are not stored in Ansible.
    - name: Show next deployment command
      debug:
        msg: "Clone repo into {{ app_dir }}, run scripts/init_env.sh, then docker compose --profile full up -d --build"
